name: Build CarStream iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Unsigned IPA Archive using xcodebuild
        run: |
          set -e
          rm -rf build
          mkdir -p build/Payload
          
          # Compile CarStream target using xcodebuild
          xcodebuild -project "CarStream.xcodeproj" \
                     -scheme "CarStream" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

          # Find compiled .app bundle dynamically
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "Found compiled app at: $APP_PATH"
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -r CarStream.ipa Payload
            echo "Successfully generated CarStream.ipa!"
          else
            echo "Error: App bundle was not found."
            exit 1
          fi

      - name: Upload CarStream IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarStream-iOS-IPA
          path: build/CarStream.ipa
